{% assign topic_videos = site.data.research_videos | where: "topic", research_video_topic %}
{% if topic_videos.size > 0 %}
<div class="research-videos">
  <div class="video-section-heading"><h4>Project demonstrations</h4><a class="text-link" href="https://www.youtube.com/channel/UCCsBkA8Ip_4OQYd7cukMT-w">More from ARL-Clemson →</a></div>
  <div class="research-video-grid{% if topic_videos.size == 1 %} single-video{% endif %}">
    {% for video in topic_videos %}
    <figure class="research-video">
      <div class="video-player"><iframe src="https://www.youtube-nocookie.com/embed/{{ video.youtube_id }}" title="{{ video.title | escape }}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
      <figcaption><p class="video-context">{{ video.context }}</p><h5>{{ video.title }}</h5><p>{{ video.description }}</p><a class="text-link" href="https://www.youtube.com/watch?v={{ video.youtube_id }}">Watch on YouTube ↗</a>{% if video.paper %}<a class="text-link video-paper-link" href="{{ site.baseurl }}{{ video.paper }}">Conference paper (PDF) →</a>{% endif %}</figcaption>
    </figure>
    {% endfor %}
  </div>
</div>
{% endif %}
